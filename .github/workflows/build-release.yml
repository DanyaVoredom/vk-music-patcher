name: build-release

on:
  push:
    branches: [main]
    paths:
      - "*.py"
      - "requirements.txt"
      - "build_patch.ps1"
      - "update_mod.ps1"
      - "updater/**"
      - ".github/workflows/build-release.yml"
  schedule:
    # 00:00 MSK (UTC+3)
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Build even if the release already exists"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Check upstream
        id: check
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || github.token }}
        run: |
          $page = Invoke-WebRequest -Uri "https://norobot.ru/vk-music/" -UseBasicParsing -TimeoutSec 60
          $match = [regex]::Match($page.Content, "Версия:\s*([0-9]+(?:\.[0-9]+)+)")
          if (-not $match.Success) { throw "upstream version not found" }
          $upstream = $match.Groups[1].Value
          $skip = $false
          $force = "${{ inputs.force }}" -eq "true"
          if (-not $force) {
            $tags = @(gh release list --repo DanyaVoredom/DanyExternal-Releases --limit 30 --json tagName --jq ".[].tagName" 2>$null)
            $latestVersion = $null
            foreach ($item in $tags) {
              $tagVersion = [regex]::Match($item, "^vk-([0-9]+(?:\.[0-9]+)+)-").Groups[1].Value
              if ($tagVersion) {
                $parsed = [version]$tagVersion
                if (-not $latestVersion -or $parsed -gt $latestVersion) { $latestVersion = $parsed }
              }
            }
            if ($latestVersion -and $latestVersion -ge ([version]$upstream)) {
              $skip = $true
            }
          }
          if ($skip) { Write-Host "release for $upstream already exists" }
          "upstream=$upstream" >> $env:GITHUB_OUTPUT
          "skip=$($skip.ToString().ToLower())" >> $env:GITHUB_OUTPUT


      - name: Check secrets
        id: secrets
        shell: pwsh
        env:
          VKM_KS_BASE64: ${{ secrets.VKM_KS_BASE64 }}
          VKM_KS_PASS: ${{ secrets.VKM_KS_PASS }}
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if (-not $env:VKM_KS_BASE64 -or -not $env:VKM_KS_PASS -or -not $env:RELEASES_TOKEN) {
            Write-Host "::warning::VKM_KS_BASE64 or VKM_KS_PASS is not configured; release build skipped"
            "ready=false" >> $env:GITHUB_OUTPUT
          }
          else {
            "ready=true" >> $env:GITHUB_OUTPUT
          }

      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip != 'true' && steps.secrets.outputs.ready == 'true'
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        if: steps.check.outputs.skip != 'true' && steps.secrets.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: "21"

      - name: Install tools
        if: steps.check.outputs.skip != 'true' && steps.secrets.outputs.ready == 'true'
        shell: pwsh
        run: |
          choco install ripgrep -y --no-progress
          $apktool = Join-Path $env:RUNNER_TEMP "apktool.jar"
          Invoke-WebRequest -Uri "https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar" -OutFile $apktool
          $sdk = if ($env:ANDROID_HOME) { $env:ANDROID_HOME } else { $env:ANDROID_SDK_ROOT }
          $buildTools = Get-ChildItem (Join-Path $sdk "build-tools") -Directory |
            Where-Object { Test-Path (Join-Path $_.FullName "aapt.exe") } |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if (-not $buildTools) { throw "build-tools not found" }
          "APKTOOL_JAR=$apktool" >> $env:GITHUB_ENV
          "BUILD_TOOLS=$($buildTools.FullName)" >> $env:GITHUB_ENV

      - name: Install Python dependencies
        if: steps.check.outputs.skip != 'true' && steps.secrets.outputs.ready == 'true'
        run: pip install -r requirements.txt

      - name: Prepare keystore
        if: steps.check.outputs.skip != 'true' && steps.secrets.outputs.ready == 'true'
        shell: pwsh
        env:
          VKM_KS_BASE64: ${{ secrets.VKM_KS_BASE64 }}
        run: |
          if (-not $env:VKM_KS_BASE64) { throw "repository secret VKM_KS_BASE64 is required" }
          [IO.File]::WriteAllBytes((Join-Path $PWD "patch.keystore"), [Convert]::FromBase64String($env:VKM_KS_BASE64))

      - name: Build mod
        if: steps.check.outputs.skip != 'true' && steps.secrets.outputs.ready == 'true'
        shell: pwsh
        env:
          VKM_KS_PASS: ${{ secrets.VKM_KS_PASS }}
          VKM_KS_ALIAS: ${{ secrets.VKM_KS_ALIAS }}
          VKM_UPDATE_REPO: DanyaVoredom/DanyExternal-Releases
          VKM_UPDATE_API: https://api.github.com/repos/{repo}/releases?per_page=10
        run: |
          $alias = if ($env:VKM_KS_ALIAS) { $env:VKM_KS_ALIAS } else { "vkmpatch" }
          .\update_mod.ps1 -NoInstall -BuildTools "$env:BUILD_TOOLS" -ApkToolJar "$env:APKTOOL_JAR" -KeyAlias $alias -ModRevision "${{ github.run_number }}"

      - name: Verify package
        if: steps.check.outputs.skip != 'true' && steps.secrets.outputs.ready == 'true'
        shell: pwsh
        run: |
          $meta = Get-Content "build/update.json" -Raw | ConvertFrom-Json
          python verify_package.py "VK_Music_$($meta.versionName).apk" "build/VK_Music_patched.apk"
          if ($LASTEXITCODE -ne 0) { throw "verify_package failed" }

      - name: Publish release
        if: steps.check.outputs.skip != 'true' && steps.secrets.outputs.ready == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          $meta = Get-Content "build/update.json" -Raw | ConvertFrom-Json
          $tag = "vk-$($meta.versionName)-$($meta.modRevision)"
          $existing = gh release view $tag --repo DanyaVoredom/DanyExternal-Releases --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            $state = $existing | ConvertFrom-Json
            if (-not $state.isDraft) {
              Write-Host "release $tag already exists"
              exit 0
            }
            gh release delete $tag --repo DanyaVoredom/DanyExternal-Releases --yes --cleanup-tag
            if ($LASTEXITCODE -ne 0) { throw "release delete failed" }
          }
          $notes = "VK Music $($meta.versionName), mod revision $($meta.modRevision), commit $($meta.commit)"
          gh release create $tag --draft --repo DanyaVoredom/DanyExternal-Releases --title "VK Music $($meta.versionName) mod $($meta.modRevision)" --notes $notes
          if ($LASTEXITCODE -ne 0) { throw "release create failed" }
          gh release upload $tag "build/$($meta.apk)" "build/update.json" --repo DanyaVoredom/DanyExternal-Releases --clobber
          if ($LASTEXITCODE -ne 0) { throw "release upload failed" }
          gh release edit $tag --draft=false --repo DanyaVoredom/DanyExternal-Releases
          if ($LASTEXITCODE -ne 0) { throw "release publish failed" }
